[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latam-medical-claim-extraction"
version = "0.1.0"
description = "Experimentos reproducibles de extracción y normalización de claims médicos en español."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
]

[project.optional-dependencies]
analysis = [
    "ipykernel>=6.29",
    "jinja2>=3.1.5",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
]
dev = [
    "pytest>=8.0",
]
models = [
    "accelerate>=1.5",
    "bert-score>=0.3.13",
    "datasets>=3.4",
    "huggingface-hub>=0.30,<1.0",
    "jupyterlab>=4.4",
    "nltk>=3.9",
    "peft>=0.15",
    "protobuf>=4.25",
    "rouge-score>=0.1.2",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "torch>=2.7",
    "transformers>=4.51,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
