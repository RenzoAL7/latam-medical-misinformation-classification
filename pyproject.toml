[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peruvian-medical-misinformation-classification"
version = "0.2.0"
description = "Corpus trazable de noticias médicas peruanas para clasificación binaria posterior."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
training = [
    "joblib>=1.4",
    "scikit-learn>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
