[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peruvian-medical-misinformation-classification"
version = "0.2.0"
description = "Corpus trazable de noticias médicas peruanas para clasificación binaria posterior."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "beautifulsoup4>=4.12",
    "pytest>=8.0",
]
training = [
    "jupyter>=1.0",
    "joblib>=1.4",
    "scikit-learn>=1.5",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
